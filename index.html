<script>

function breachArchive(){

    // PREVENT DOUBLE TRIGGER
    if(document.getElementById("archiveOverlay")) return;

    // OVERLAY
    const overlay = document.createElement("div");
    overlay.id = "archiveOverlay";

    overlay.style.cssText = `
        position:fixed;
        inset:0;
        background:#000;
        color:#00ff88;
        font-family:monospace;
        font-size:16px;
        padding:40px;
        z-index:99999;
        overflow:hidden;
    `;

    document.body.appendChild(overlay);

    // SCANLINES
    const scanlines = document.createElement("div");

    scanlines.style.cssText = `
        position:absolute;
        inset:0;
        pointer-events:none;
        background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.03) 0px,
            rgba(255,255,255,0.03) 1px,
            transparent 2px,
            transparent 4px
        );
        mix-blend-mode:overlay;
    `;

    overlay.appendChild(scanlines);

    // TEXT LAYERS
    const red = document.createElement("div");
    const blue = document.createElement("div");
    const green = document.createElement("div");

    [red, blue, green].forEach(layer => {

        layer.style.cssText = `
            position:absolute;
            top:40px;
            left:40px;
            right:40px;
            white-space:pre-line;
            line-height:1.6;
        `;

        overlay.appendChild(layer);
    });

    red.style.color = "rgba(255,0,0,0.45)";
    blue.style.color = "rgba(0,180,255,0.45)";
    green.style.color = "#00ff88";

    const messages = [
        "INITIALIZING CONTINUITY ARCHIVE CONNECTION...",
        "VERIFYING PERMISSIONS...",
        "ACCESS REQUEST: RESEARCH DIVISIONS",
        "STATUS: DENIED",
        "OVERRIDE DETECTED...",
        "FOREUM AUTHORIZATION FOUND",
        "SYSTEM RESPONSE: ACCEPTED",
        "REDIRECTING..."
    ];

    let output = "";
    let msgIndex = 0;

    // RANDOM CHARACTER CORRUPTION
    function corrupt(text){

        const chars = "!<>-_\\/[]{}=+*^?#";

        return text.split("").map(letter => {

            if(Math.random() < 0.06 && letter !== " "){
                return chars[Math.floor(Math.random()*chars.length)];
            }

            return letter;

        }).join("");
    }

    // UPDATE ALL LAYERS
    function render(content){

        green.innerHTML = content;
        red.innerHTML = content;
        blue.innerHTML = content;
    }

    // CONTINUOUS GLITCH
    function animateGlitch(){

        const x = (Math.random() - 0.5) * 6;
        const y = (Math.random() - 0.5) * 3;

        red.style.transform =
            `translate(${x}px, ${y}px)`;

        blue.style.transform =
            `translate(${-x}px, ${-y}px)`;

        // OCCASIONAL SCREEN SHAKE
        if(Math.random() > 0.96){

            overlay.style.transform =
                `translateX(${Math.random()*8-4}px)`;

        } else {

            overlay.style.transform = "translateX(0px)";
        }

        requestAnimationFrame(animateGlitch);
    }

    animateGlitch();

    // TYPEWRITER
    function typeMessage(message, done){

        let current = "";
        let charIndex = 0;

        function type(){

            if(charIndex < message.length){

                current += message[charIndex];

                render(output + "> " + corrupt(current));

                charIndex++;

                // RANDOM FLASH
                if(Math.random() > 0.97){

                    overlay.style.background = "#021";

                    setTimeout(()=>{
                        overlay.style.background = "#000";
                    },50);
                }

                setTimeout(type, 25 + Math.random()*35);

            } else {

                output += "> " + message + "\n";

                render(output);

                done();
            }
        }

        type();
    }

    // MESSAGE LOOP
    function next(){

        if(msgIndex < messages.length){

            typeMessage(messages[msgIndex], ()=>{

                msgIndex++;

                setTimeout(next, 500);

            });

        } else {

            // FINAL EFFECT
            overlay.style.animation =
                "finalGlitch 0.08s infinite";

            setTimeout(()=>{

                render(`
ACCESS GRANTED

OPENING ARCHIVE...
                `);

            },800);

            setTimeout(()=>{

                window.location.href =
                "https://github.com/Banana346-cyph/continuity-archive/tree/main/pdfs";

            },2200);
        }
    }

    next();
}

// GLITCH KEYFRAMES
const style = document.createElement("style");

style.innerHTML = `
@keyframes finalGlitch{

    0%{transform:translate(2px,0);}
    20%{transform:translate(-2px,1px);}
    40%{transform:translate(3px,-1px);}
    60%{transform:translate(-3px,1px);}
    80%{transform:translate(1px,-2px);}
    100%{transform:translate(0,0);}
}
`;

document.head.appendChild(style);

</script>
