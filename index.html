<!-- GLITCH SCRIPT -->
<script>

function breachArchive(){

    // CREATE OVERLAY
    let overlay = document.createElement("div");

    overlay.style.position = "fixed";
    overlay.style.top = "0";
    overlay.style.left = "0";
    overlay.style.width = "100%";
    overlay.style.height = "100%";
    overlay.style.background = "#000";
    overlay.style.color = "#00ff88";
    overlay.style.fontFamily = "monospace";
    overlay.style.fontSize = "16px";
    overlay.style.padding = "40px";
    overlay.style.zIndex = "99999";
    overlay.style.whiteSpace = "pre-line";
    overlay.style.overflow = "hidden";

    // SCANLINES
    overlay.style.backgroundImage = `
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.03) 0px,
            rgba(255,255,255,0.03) 1px,
            transparent 2px,
            transparent 4px
        )
    `;

    document.body.appendChild(overlay);

    // RGB GLITCH LAYERS
    let red = document.createElement("div");
    let blue = document.createElement("div");
    let text = document.createElement("div");

    [red, blue, text].forEach(layer => {
        layer.style.position = "absolute";
        layer.style.top = "40px";
        layer.style.left = "40px";
        layer.style.right = "40px";
        layer.style.whiteSpace = "pre-line";
    });

    red.style.color = "rgba(255,0,0,0.5)";
    blue.style.color = "rgba(0,180,255,0.5)";
    text.style.color = "#00ff88";

    overlay.appendChild(red);
    overlay.appendChild(blue);
    overlay.appendChild(text);

    let messages = [
        "INITIALIZING CONTINUITY ARCHIVE CONNECTION...",
        "VERIFYING PERMISSIONS...",
        "ACCESS REQUEST: RESEARCH DIVISIONS",
        "STATUS: DENIED",
        "OVERRIDE DETECTED...",
        "FOREUM AUTHORIZATION FOUND",
        "SYSTEM RESPONSE: ACCEPTED",
        "REDIRECTING..."
    ];

    let output = "";
    let i = 0;

    // RANDOM CHARACTER SCRAMBLE
    function corrupt(str){
        let chars = "!<>-_\\/[]{}—=+*^?#________";
        return str.split("").map(c => {
            if(Math.random() < 0.08){
                return chars[Math.floor(Math.random()*chars.length)];
            }
            return c;
        }).join("");
    }

    // GLITCH EFFECT
    function glitch(){

        let offsetX = (Math.random() - 0.5) * 8;
        let offsetY = (Math.random() - 0.5) * 4;

        red.style.transform =
            `translate(${offsetX}px, ${offsetY}px)`;

        blue.style.transform =
            `translate(${-offsetX}px, ${-offsetY}px)`;

        overlay.style.opacity =
            Math.random() > 0.96 ? "0.92" : "1";

        // SCREEN TEAR
        if(Math.random() > 0.93){
            overlay.style.transform =
                `translateY(${Math.random()*8-4}px) skewX(${Math.random()*4-2}deg)`;
        } else {
            overlay.style.transform = "none";
        }

        requestAnimationFrame(glitch);
    }

    glitch();

    // TYPEWRITER EFFECT
    function typeLine(line, callback){

        let current = "";
        let index = 0;

        function type(){

            if(index < line.length){

                current += line[index];

                let corrupted = corrupt(current);

                text.innerHTML = output + "> " + corrupted;
                red.innerHTML = text.innerHTML;
                blue.innerHTML = text.innerHTML;

                index++;

                let speed = Math.random() * 40 + 20;

                // RANDOM FLASH
                if(Math.random() > 0.96){
                    overlay.style.backgroundColor = "#021";
                    setTimeout(()=>{
                        overlay.style.backgroundColor = "#000";
                    },60);
                }

                setTimeout(type, speed);

            } else {

                output += "> " + line + "\n";

                text.innerHTML = output;
                red.innerHTML = output;
                blue.innerHTML = output;

                callback();
            }
        }

        type();
    }

    function nextMessage(){

        if(i < messages.length){

            typeLine(messages[i], () => {
                i++;
                setTimeout(nextMessage, 500);
            });

        } else {

            // FINAL HEAVY GLITCH
            overlay.style.animation = "shake 0.08s infinite";

            setTimeout(function(){

                overlay.innerHTML = `
                    <div style="
                        color:#ff0033;
                        font-size:32px;
                        text-align:center;
                        margin-top:20vh;
                        letter-spacing:6px;
                    ">
                        ACCESS GRANTED
                    </div>
                `;

                setTimeout(function(){
                    window.location.href =
                    "https://github.com/Banana346-cyph/continuity-archive/tree/main/pdfs";
                },1500);

            },1000);
        }
    }

    nextMessage();
}

// SHAKE ANIMATION
const style = document.createElement("style");

style.innerHTML = `
@keyframes shake{
    0%{transform:translate(2px,1px);}
    20%{transform:translate(-2px,0);}
    40%{transform:translate(3px,-1px);}
    60%{transform:translate(-3px,1px);}
    80%{transform:translate(1px,-2px);}
    100%{transform:translate(0,0);}
}
`;

document.head.appendChild(style);

</script>
